apiVersion: v1
kind: Service
metadata:
  name: {{ include "zk-object-fabric.fullname" . }}
  labels:
    {{- include "zk-object-fabric.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "zk-object-fabric.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.s3Port }}
      targetPort: s3
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.s3NodePort }}
      nodePort: {{ .Values.service.s3NodePort }}
      {{- end }}
    {{- if .Values.config.console.enabled }}
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.consoleNodePort }}
      nodePort: {{ .Values.service.consoleNodePort }}
      {{- end }}
    {{- end }}
