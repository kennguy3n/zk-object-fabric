{{- if .Values.secret.create }}
{{- /*
Holds the gateway credentials referenced by the config.json placeholders
(${WASABI_ACCESS_KEY}, ${WASABI_SECRET_KEY}, ${METADATA_DSN}, ${VAULT_TOKEN},
${CONSOLE_ADMIN_TOKEN}). The init container loads these as env vars and runs
envsubst to render the final config. Set secret.create=false and
secret.existingSecret to manage credentials with Vault / SOPS / External
Secrets instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zk-object-fabric.secretName" . }}
  labels:
    {{- include "zk-object-fabric.labels" . | nindent 4 }}
type: Opaque
stringData:
  WASABI_ACCESS_KEY: {{ .Values.secret.wasabiAccessKey | quote }}
  WASABI_SECRET_KEY: {{ .Values.secret.wasabiSecretKey | quote }}
  METADATA_DSN: {{ .Values.secret.metadataDsn | quote }}
  VAULT_TOKEN: {{ .Values.secret.vaultToken | quote }}
  CONSOLE_ADMIN_TOKEN: {{ .Values.secret.consoleAdminToken | quote }}
{{- end }}
{{- /*
Manifest-body encryption key. It is raw 32-byte material the gateway reads as a
file (os.ReadFile), so it is carried under `data` (already base64) and only ever
volume-mounted by the Deployment. It lives in its OWN Secret rather than the
credentials Secret above: the credentials Secret is consumed via envFrom, and a
dotted key name (manifest-body.key) there would make Kubernetes log a warning on
every pod start while skipping the invalid env var. Keeping it separate also
decouples it from secret.create, so an inline value works even when the
credentials come from an external Secret. Only emitted when inlined via value;
use manifestBodyKey.existingSecret to manage it elsewhere.
*/}}
{{- with .Values.config.encryption.manifestBodyKey }}
{{- if and .value (not .existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zk-object-fabric.manifestBodyKeySecretName" $ }}
  labels:
    {{- include "zk-object-fabric.labels" $ | nindent 4 }}
type: Opaque
data:
  {{ .existingSecretKey }}: {{ .value | quote }}
{{- end }}
{{- end }}
