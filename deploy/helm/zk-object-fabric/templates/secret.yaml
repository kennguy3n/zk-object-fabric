{{- if .Values.secret.create }}
{{- /*
Holds the gateway credentials referenced by the config.json placeholders
(${WASABI_ACCESS_KEY}, ${WASABI_SECRET_KEY}, ${METADATA_DSN}, ${VAULT_TOKEN},
${CONSOLE_ADMIN_TOKEN}). The init container loads these as env vars and runs
envsubst to render the final config. Set secret.create=false and
secret.existingSecret to manage credentials with Vault / SOPS / External
Secrets instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zk-object-fabric.secretName" . }}
  labels:
    {{- include "zk-object-fabric.labels" . | nindent 4 }}
type: Opaque
stringData:
  WASABI_ACCESS_KEY: {{ .Values.secret.wasabiAccessKey | quote }}
  WASABI_SECRET_KEY: {{ .Values.secret.wasabiSecretKey | quote }}
  METADATA_DSN: {{ .Values.secret.metadataDsn | quote }}
  VAULT_TOKEN: {{ .Values.secret.vaultToken | quote }}
  CONSOLE_ADMIN_TOKEN: {{ .Values.secret.consoleAdminToken | quote }}
{{- end }}
