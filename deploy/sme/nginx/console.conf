# Console web tier: serves the React SPA bundle (copied out of the
# gateway image by the frontend-init service) and reverse-proxies the
# JSON API to the gateway's console listener (:8081). Traefik terminates
# TLS in front of this server, so it speaks plain HTTP on :80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + Server-Sent-Events stream go to the gateway console listener.
    # "gateway" resolves to every replica via Docker's embedded DNS, so
    # nginx round-robins across them.
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (console event stream) must not be buffered or timed out.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # SPA history-mode fallback: unknown paths render index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed by Vite, so static assets are
    # immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
