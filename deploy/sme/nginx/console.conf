# Console web tier: serves the React SPA bundle (copied out of the
# gateway image by the frontend-init service) and reverse-proxies the
# JSON API to the gateway's console listener (:8081). Traefik terminates
# TLS in front of this server, so it speaks plain HTTP on :80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the "gateway" service name at runtime via Docker's embedded
    # DNS (127.0.0.11) with a short TTL. Without this, nginx resolves the
    # upstream once at startup and caches the IPs permanently — so after a
    # rolling upgrade (upgrade.sh replaces each replica, giving it a new IP)
    # nginx would keep proxying /api/ to the dead old IPs and return 502.
    # The `set` + variable in proxy_pass is what forces nginx to honour the
    # resolver instead of doing one-shot startup resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API + Server-Sent-Events stream go to the gateway console listener.
    # "gateway" resolves to every live replica via Docker's embedded DNS, so
    # nginx round-robins across them and picks up replacements after an
    # upgrade within the resolver TTL.
    location /api/ {
        set $gateway_upstream gateway;
        proxy_pass http://$gateway_upstream:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (console event stream) must not be buffered or timed out.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # SPA history-mode fallback: unknown paths render index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed by Vite, so static assets are
    # immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
