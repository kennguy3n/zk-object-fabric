# ZK Object Fabric — one-command demo stack.
#
# Builds the multi-stage Dockerfile at the repo root and runs the
# gateway in dev mode: local_fs_dev backend rooted at /data/objects,
# embedded SQLite metadata store at /data/metadata/embedded.db,
# logger billing sink, S3 API on :8080, console API on :8081. Tenant
# bindings are pre-loaded from demo/tenants.json.
#
# See demo/README.md for downstream integration examples (kmail,
# zk-drive). Object data persists in the zk-data volume; manifest,
# content-index, auth, and billing state persist in the embedded
# SQLite database on the zk-metadata volume, so they now survive a
# container restart (control_plane.embedded_db_path in
# demo/config.json). Point control_plane.metadata_dsn at a Postgres
# to switch the whole control plane to Postgres instead.

services:
  zk-fabric:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zk-fabric
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - zk-data:/data/objects
      - zk-metadata:/data/metadata
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  zk-data:
  zk-metadata:
