name: ci

# Core Go CI: runs on every PR and every push to main. Covers
# build, vet, race-enabled tests, the S3 compatibility suite,
# static analysis (staticcheck), vulnerability scanning
# (govulncheck), and a Docker image build to make sure the
# Dockerfile still produces a working gateway image.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    name: go-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build (gateway)
        run: go build ./cmd/gateway

      - name: go build (all)
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        # The race detector is slow but catches data races in the
        # multipart store, hot-object cache, and signal bus that
        # the plain test run misses. Worth the extra ~3-4 minutes.
        run: go test -race -count=1 ./...

      - name: S3 compatibility suite (verbose)
        run: go test -v ./tests/s3_compat/

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zk-object-fabric/gateway:ci
