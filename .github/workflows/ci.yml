name: ci

# Core Go CI: runs on every PR and every push to main. Covers
# build, vet, race-enabled tests, the S3 compatibility suite,
# static analysis (staticcheck), vulnerability scanning
# (govulncheck), and a Docker image build to make sure the
# Dockerfile still produces a working gateway image.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    name: go-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      # go mod verify reads go.sum and confirms every module the
      # build will use matches its recorded checksum. Running it
      # before the build catches supply-chain tampering or a
      # corrupt module cache that would otherwise slip past
      # build-and-test (the build only fails on type errors, not
      # checksum drift).
      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go build (gateway)
        run: go build ./cmd/gateway

      - name: go build (all)
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        # The race detector is slow but catches data races in the
        # multipart store, hot-object cache, and signal bus that
        # the plain test run misses. Worth the extra ~3-4 minutes.
        run: go test -race -count=1 ./...

      - name: S3 compatibility suite (verbose)
        run: go test -v ./tests/s3_compat/

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 pulls the full commit history AND all
      # tags. Without it actions/checkout@v4 defaults to a shallow
      # depth=1 clone with no tags, so `git describe --tags` below
      # silently falls back to the bare commit SHA on every CI run
      # — defeating the version-stamp's "follow the latest
      # annotated tag" contract. The --always flag still keeps the
      # command from erroring on a brand-new repo with zero tags,
      # but with the full clone the tag-derived semver wins
      # whenever a tag is reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # Resolve the version-stamp build args once so the docker
      # build-push step gets a reproducible triple. VERSION
      # follows the latest annotated tag; on PRs without a tag
      # the binary advertises "v0.0.0-<sha>" so operators can
      # still trace a running image back to a git revision.
      - name: Resolve version metadata
        id: version
        run: |
          set -eu
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)"
          GIT_COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'version=%s\n' "$VERSION"
            printf 'git_commit=%s\n' "$GIT_COMMIT"
            printf 'build_date=%s\n' "$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zk-object-fabric/gateway:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}

  load-test-smoke:
    name: load-test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      - name: Build benchmark-runner
        run: go build -o benchmark-runner ./cmd/benchmark-runner

      # Smoke-only: short duration, low RPS, small objects,
      # local_fs_dev backend. This validates that the sustained
      # runner, rate limiter, and HDR histograms still wire up
      # end-to-end and that the suite's declared targets are
      # populated. It does NOT validate the production SLA -- that
      # is the Tier-3 Linode+Wasabi run documented in
      # docs/runbooks/load-testing.md.
      - name: Run load-test smoke (put-cache-hit)
        run: |
          ./benchmark-runner \
            -provider=local_fs_dev \
            -scenario=put-cache-hit \
            -duration=1s \
            -rps=100 \
            -seed-objects=16 \
            -max-object-bytes=4096 \
            -out=load-smoke-put.json

      - name: Run load-test smoke (get-l0-cache-hit)
        run: |
          ./benchmark-runner \
            -provider=local_fs_dev \
            -scenario=get-l0-cache-hit \
            -duration=1s \
            -rps=100 \
            -seed-objects=32 \
            -max-object-bytes=4096 \
            -out=load-smoke-get.json

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-smoke-reports
          path: load-smoke-*.json
          retention-days: 14
