name: ci

# Core Go CI: runs on every PR and every push to main. Covers
# build, vet, race-enabled tests, the S3 compatibility suite,
# static analysis (staticcheck), vulnerability scanning
# (govulncheck), and a Docker image build to make sure the
# Dockerfile still produces a working gateway image.

on:
  pull_request:
  push:
    branches:
      - main
  # staging-validation below is dispatch-only: it runs the heavy
  # production-validation checklist (race suite, chaos, DR verifier,
  # live Ceph RGW S3 conformance) on demand from the Actions tab. It
  # does NOT run Tier 3 (paid Linode + Wasabi) load — that stays a
  # manual staging run (docs/runbooks/load-testing.md §4).
  workflow_dispatch:

jobs:
  go:
    name: go-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      # go mod verify reads go.sum and confirms every module the
      # build will use matches its recorded checksum. Running it
      # before the build catches supply-chain tampering or a
      # corrupt module cache that would otherwise slip past
      # build-and-test (the build only fails on type errors, not
      # checksum drift).
      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go build (gateway)
        run: go build ./cmd/gateway

      - name: go build (all)
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        # The race detector is slow but catches data races in the
        # multipart store, hot-object cache, and signal bus that
        # the plain test run misses. Worth the extra ~3-4 minutes.
        run: go test -race -count=1 ./...

      - name: S3 compatibility suite (verbose)
        run: go test -v ./tests/s3_compat/

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 pulls the full commit history AND all
      # tags. Without it actions/checkout@v4 defaults to a shallow
      # depth=1 clone with no tags, so `git describe --tags` below
      # silently falls back to the bare commit SHA on every CI run
      # — defeating the version-stamp's "follow the latest
      # annotated tag" contract. The --always flag still keeps the
      # command from erroring on a brand-new repo with zero tags,
      # but with the full clone the tag-derived semver wins
      # whenever a tag is reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # Resolve the version-stamp build args once so the docker
      # build-push step gets a reproducible triple. VERSION
      # follows the latest annotated tag; on PRs without a tag
      # the binary advertises "v0.0.0-<sha>" so operators can
      # still trace a running image back to a git revision.
      - name: Resolve version metadata
        id: version
        run: |
          set -eu
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)"
          GIT_COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'version=%s\n' "$VERSION"
            printf 'git_commit=%s\n' "$GIT_COMMIT"
            printf 'build_date=%s\n' "$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zk-object-fabric/gateway:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}

  load-test-smoke:
    name: load-test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      - name: Build benchmark-runner
        run: go build -o benchmark-runner ./cmd/benchmark-runner

      # Smoke-only: short duration, low RPS, small objects,
      # local_fs_dev backend. This validates that the sustained
      # runner, rate limiter, and HDR histograms still wire up
      # end-to-end and that the suite's declared targets are
      # populated. It does NOT validate the production SLA -- that
      # is the Tier-3 Linode+Wasabi run documented in
      # docs/runbooks/load-testing.md.
      - name: Run load-test smoke (put-cache-hit)
        run: |
          ./benchmark-runner \
            -provider=local_fs_dev \
            -scenario=put-cache-hit \
            -duration=1s \
            -rps=100 \
            -seed-objects=16 \
            -max-object-bytes=4096 \
            -out=load-smoke-put.json

      - name: Run load-test smoke (get-l0-cache-hit)
        run: |
          ./benchmark-runner \
            -provider=local_fs_dev \
            -scenario=get-l0-cache-hit \
            -duration=1s \
            -rps=100 \
            -seed-objects=32 \
            -max-object-bytes=4096 \
            -out=load-smoke-get.json

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-smoke-reports
          path: load-smoke-*.json
          retention-days: 14

  staging-validation:
    name: staging-validation
    # Dispatch-only: this job is the CI-automatable portion of the
    # production-validation checklist. It is gated on the manual
    # workflow_dispatch event so it never runs on PRs or pushes (the
    # lighter `go`, `static-analysis`, `govulncheck`, and
    # `load-test-smoke` jobs above cover those). Tier 3 staging load
    # (paid infra + a human operator) is intentionally excluded.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go mod download
        run: go mod download

      # (a) Full race-enabled test suite. `make test` is
      # `go test -race -count=1 ./...` (see Makefile).
      - name: make test (race)
        run: make test

      # (b) Static analysis + vulnerability scan, matching the
      # dedicated CI jobs so the dispatch run is self-contained.
      - name: go vet
        run: go vet ./...

      - name: Install staticcheck + govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: govulncheck
        run: govulncheck ./...

      # (c) Chaos suite: fault-injection scenarios.
      - name: Chaos suite
        run: go test ./tests/chaos/ -v

      # (d) Disaster-recovery verifier.
      - name: DR verifier
        run: go test ./tests/dr/ -v

      # (e) Full S3 conformance against the Ceph RGW Docker demo
      # container. This is the live-backend conformance run
      # (TestSuite_CephRGW); the in-process backends are already
      # covered by `go test ./tests/s3_compat/` in the `go` job and
      # the race suite above. Boot params mirror the operator runbook
      # / environment blueprint exactly.
      - name: Start Ceph RGW demo container
        run: |
          docker rm -f ceph-demo 2>/dev/null || true
          sudo rm -rf /var/lib/ceph-demo
          sudo mkdir -p /var/lib/ceph-demo/etc /var/lib/ceph-demo/lib
          docker run -d --name ceph-demo --restart=no \
            -e MON_IP=127.0.0.1 \
            -e CEPH_PUBLIC_NETWORK=127.0.0.0/8 \
            -e CEPH_DEMO_UID=zkof \
            -e CEPH_DEMO_ACCESS_KEY=zkof-test-ak \
            -e CEPH_DEMO_SECRET_KEY=zkof-test-sk-0000000000000000000000000 \
            -e RGW_NAME=ceph-demo \
            -e RGW_FRONTEND_PORT=8888 \
            -e NETWORK_AUTO_DETECT=0 \
            -p 8888:8888 \
            -v /var/lib/ceph-demo/etc:/etc/ceph \
            -v /var/lib/ceph-demo/lib:/var/lib/ceph \
            quay.io/ceph/demo:latest-reef demo

      - name: Wait for RGW + create compliance bucket
        run: |
          # Poll until RGW answers, bounded by a real elapsed-time
          # deadline (bash $SECONDS) so the reported timing is accurate
          # and the step fails fast if the container never comes up.
          deadline=$((SECONDS + 180))
          until curl -sf http://127.0.0.1:8888/ >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "RGW did not come up within 180s" >&2
              docker logs ceph-demo | tail -50 >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "RGW is up after ${SECONDS}s"
          AWS_ACCESS_KEY_ID=zkof-test-ak \
          AWS_SECRET_ACCESS_KEY=zkof-test-sk-0000000000000000000000000 \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:8888 s3api create-bucket \
              --bucket zkof-ceph-compliance 2>/dev/null || true

      - name: S3 conformance suite (live Ceph RGW)
        env:
          CEPH_RGW_ENDPOINT: http://127.0.0.1:8888
          CEPH_RGW_BUCKET: zkof-ceph-compliance
          CEPH_RGW_ACCESS_KEY: zkof-test-ak
          CEPH_RGW_SECRET_KEY: zkof-test-sk-0000000000000000000000000
          # Match the region the bucket is created with above and the
          # us-east-1 region the rest of the conformance suite uses.
          CEPH_RGW_REGION: us-east-1
        run: go test -v -run TestSuite_CephRGW ./tests/s3_compat/ -timeout 15m

      - name: Tear down Ceph RGW demo container
        if: always()
        run: docker rm -f ceph-demo 2>/dev/null || true
